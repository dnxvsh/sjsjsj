name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q herobrine-forge-1.20.1.zip

      - name: Build
        working-directory: herobrine-forge-1.20.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: herobrinemod
          path: herobrine-forge-1.20.1/build/libs/*.jar
