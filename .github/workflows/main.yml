name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip newest project zip
        run: |
          ZIP=$(git log -1 --name-only --format= -- '*.zip' | head -1)
          echo "Using $ZIP"
          unzip -q "$ZIP"

      - name: Build
        working-directory: herobrine-forge-1.20.1
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee ../build.log

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -n -E -B1 -A6 'error:|FAILURE|What went wrong|Execution failed|Could not' build.log | head -300
            echo '```'
            echo '## Last 60 lines'
            echo '```'
            tail -n 60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: herobrinemod
          path: herobrine-forge-1.20.1/build/libs/*.jar
